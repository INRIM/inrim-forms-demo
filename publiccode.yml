description:
  it:
    documentation: 'https://inrim.github.io/service-app/demo/'
    features:
      - >-
        Form builder Drag&Drop (formio.js), per disegnare i moduli senza
        scrivere codice;
      - >-
        Rendering dei moduli col tema Bootstrap Italia (Linee Guida di Design
        per la P.A.);
      - >-
        Regole su dati e campi tramite json-logic, valutate lato server;
      - >-
        Persistenza dei dati su MongoDB, con CRUD generico generato dal modulo;
      - >-
        Autenticazione Keycloak OpenID Connect (Authorization Code, pattern
        BFF), senza login locale;
      - >-
        Multi tenant per app_code. Un unico backend a supporto di piu'
        applicazioni e frontend;
      - >-
        Sistema a plugin. Un'applicazione e' una cartella montata in
        /plugins/<app_code>, installata all'avvio;
      - >-
        Regole di sicurezza per gruppo e per campo (ACL su model, campi e
        record);
      - >-
        Servizi companion inclusi: invio mail, scheduler di calendario,
        identity manager;
      - >-
        Stack Docker Compose completo, installato e avviato da un solo comando;
    longDescription: >
      **Inrim Forms Demo** e' la demo eseguibile di
      [Service App](https://github.com/INRIM/service-app) 3.0
      (`ozon-env-app`): un backend RAD multi tenant che genera moduli
      "Drag&Drop" con formio.js builder, li renderizza col tema Bootstrap
      Italia e ne gestisce i dati su MongoDB.


      Un solo comando (`demo/run_demo.sh up`) installa e avvia l'intero stack
      in Docker: Keycloak, MongoDB, backend, servizi companion e web client,
      con un plugin di esempio gia' installato e quattro utenti di test. Lo
      script clona da solo il repository Service App se non e' gia' presente,
      genera i segreti locali, effettua il provisioning del realm Keycloak e
      installa il plugin.


      Principali caratteristiche:


      - Form builder Drag&Drop (formio.js), per disegnare i moduli senza
        scrivere codice;

      - Rendering dei moduli col tema Bootstrap Italia (Linee Guida di Design
        per la P.A.), responsive anche su dispositivi mobili;

      - Regole su dati e campi tramite json-logic, valutate lato server;

      - Persistenza su MongoDB, con CRUD generico generato a partire dal
        modulo disegnato;

      - Autenticazione Keycloak OpenID Connect (Authorization Code, pattern
        BFF): il frontend resta su una sola origin e non gestisce token;

      - Multi tenant per `app_code`. Un unico backend serve piu' applicazioni,
        ognuna col proprio frontend e i propri dati;

      - Sistema a plugin. Un'applicazione e' una cartella con manifest, schema
        dei moduli e dati di seed, montata in `/plugins/<app_code>` e
        installata all'avvio;

      - Regole di sicurezza per gruppo e per campo, con ACL su model, campi e
        singoli record;

      - Servizi companion inclusi: invio mail, scheduler di calendario e
        identity manager;

      - Stack Docker Compose completo, con installazione e avvio automatici.


      Il progetto e' a scopo di demo e di riferimento per chi costruisce
      applicazioni su Service App.


      Documentazione: la guida della demo e' su
      [inrim.github.io/service-app/demo](https://inrim.github.io/service-app/demo/),
      la documentazione della piattaforma Ozon App su
      [inrim.github.io/service-app](https://inrim.github.io/service-app/).
