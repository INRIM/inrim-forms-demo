description:
  it:
    shortDescription: Demo eseguibile di Service App 3.0 (ozon-env-app)
    longDescription: |
      Demo eseguibile di
      **[Service App](https://github.com/INRIM/service-app)** 3.0
      (`ozon-env-app`): un backend RAD multi-tenant che genera form
      "Drag&Drop" con formio.js builder, le renderizza col tema Bootstrap
      Italia e gestisce i dati su MongoDB.


      Un solo comando (`demo/run_demo.sh up`) installa e avvia l'intero
      stack in Docker — Keycloak, MongoDB, backend, servizi companion
      (mail-sender, calendar-scheduler, identity-manager) e web-client —
      con un plugin di esempio gia' installato e quattro utenti di test.
      Lo script clona da solo il repository Service App se non e' gia'
      presente, genera i segreti locali, effettua il provisioning del realm
      Keycloak e installa il plugin.


      Il progetto mostra come strutturare un'applicazione sul backend:
      un "plugin" e' una cartella con un manifest, lo schema delle form
      (formato formio.js) e i dati di seed (voci di menu e azioni), montata
      in `/plugins/<app_code>` e installata all'avvio.


      E' possibile:

      1. implementare regole sui dati e sui campi tramite json-logic

      2. autenticare gli utenti tramite Keycloak (OpenID Connect)

      3. implementare regole di sicurezza per gruppo/ruolo

      4. servire piu' applicazioni (`app_code`) con un unico backend

      Il progetto e' a scopo di demo e di riferimento per chi costruisce
      applicazioni su Service App.
    features:
      - Form Builder Drag&Drop (formio.js)
      - Tema Bootstrap Italia / linee guida design AGID
      - Json-logic su dati e campi
      - MongoDB
      - Autenticazione Keycloak OpenID Connect (Authorization Code, pattern BFF)
      - Multi-tenant per app_code
      - Sistema a plugin su /plugins/<app_code>
      - 'Servizi companion: mail-sender, calendar-scheduler, identity-manager'
      - Stack Docker Compose con installazione e avvio automatici
